<div class="col-12">
    <form id="filterForm" method="GET" class="row g-3 mb-3">
        <div class="col-md-3">
            <input type="text" name="name" class="form-control form-control-sm" 
                   placeholder="🔍 Search by name..." 
                   value="{{ filters.name|default:'' }}">
        </div>

        <div class="col-md-3">
            <select name="parent_id" class="form-select form-select-sm">
                <option value="">All Parents</option>
                {% for p in parent_categories %}
                    <option value="{{ p.id }}" {% if filters.parent_id == p.id|stringformat:"s" %}selected{% endif %}>
                        {{ p.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-2">
            <select name="display_on" class="form-select form-select-sm">
                <option value="">All Pages</option>
                <option value="default" {% if filters.display_on == 'default' %}selected{% endif %}>Default</option>
                <option value="header" {% if filters.display_on == 'header' %}selected{% endif %}>Header</option>
                <option value="footer" {% if filters.display_on == 'footer' %}selected{% endif %}>Footer</option>
            </select>
        </div>

        <div class="col-md-2">
            <select name="status" class="form-select form-select-sm">
                <option value="">All Status</option>
                <option value="1" {% if filters.status == '1' %}selected{% endif %}>✅ Active</option>
                <option value="0" {% if filters.status == '0' %}selected{% endif %}>❌ Inactive</option>
            </select>
        </div>
        
        <div class="col-md-2 d-flex gap-2">
            <a href="{% url 'categories:category_list' %}" class="btn btn-primary btn-sm text-white">✕ Reset</a>
        </div>
    </form>
</div>
