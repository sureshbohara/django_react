<div class="col-12">
    <div class="table-responsive">
        <table class="table table-hover table-striped align-middle">
            <thead class="table-success">
                <tr>
                    <th width="60">Image</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th width="100">Status</th>
                    <th width="120">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td><img src="{{ item.image_url }}" width="40" height="40" style="object-fit: cover; border-radius: 50%;"></td>
                    <td><strong>{{ item.name }}</strong></td>
                    <td>{{ item.email }}</td>
                    <td>{{ item.mobile|default:"-" }}</td>
                    <td>
                        <form class="status-form" data-id="{{ item.id }}">
                            {% csrf_token %}
                            <input type="hidden" name="status_id" value="{{ item.id }}">
                            <input type="checkbox" {% if item.status %}checked{% endif %} data-toggle="toggle" data-onstyle="success" data-offstyle="danger" data-size="sm">
                        </form>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="{% url 'accounts:admin_user_update' item.id %}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i></a>
                            <form action="{% url 'accounts:admin_user_delete' item.id %}" method="POST" id="deleteForm{{ item.id }}" style="display:inline;">
                                {% csrf_token %}
                                <button type="button" class="btn btn-outline-danger" onclick="confirmDelete(event, 'deleteForm{{ item.id }}')"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="6" class="text-center py-4 text-muted">No admin users found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
