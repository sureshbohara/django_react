{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Manage Coupons{% endblock %}

{% block content %}
<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
            <li class="breadcrumb-item"><a href="{% url 'core:dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item active">Coupons</li>
        </ol>
    </nav>
</div>

<div class="card mb-4">
    <div class="card-header bg-custom text-white d-flex align-items-center justify-content-between py-2">
        <h6 class="mb-0">Coupons</h6>
        <a href="{% url 'coupons:coupon_create' %}" class="btn btn-light btn-sm">
            <i class="bi bi-plus-lg"></i> Create New
        </a>
    </div>
    <div class="card-body bg-light p-3">
        <div class="row mb-3">{% include 'admin/coupons/search.html' %}</div>
        <div class="row">{% include 'admin/coupons/table.html' %}</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function() {
        AdminCRUD.initStatusToggle("{% url 'coupons:coupon_toggle_status' %}", 'Coupon status updated!');
        AdminCRUD.initFilterAutoSubmit('#filterForm', 300);
    });
</script>
{% endblock %}
