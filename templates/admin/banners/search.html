<div class="col-12">
    <form id="filterForm" method="GET" class="row g-3 mb-3">
        <div class="col-md-5">
            <input type="text" name="title" class="form-control form-control-sm" placeholder="🔍 Search by title..." value="{{ filters.title|default:'' }}">
        </div>
        <div class="col-md-5">
            <select name="status" class="form-select form-select-sm">
                <option value="">All Status</option>
                <option value="1" {% if filters.status == '1' %}selected{% endif %}>✅ Active</option>
                <option value="0" {% if filters.status == '0' %}selected{% endif %}>❌ Inactive</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <a href="{% url 'banners:banner_list' %}" class="btn btn-primary btn-sm text-white">✕ Reset</a>
        </div>
    </form>
</div>
