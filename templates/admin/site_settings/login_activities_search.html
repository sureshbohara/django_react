<div class="col-12">
    <form id="filterForm" method="GET" class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label small text-muted">Search</label>
            <input type="text" name="search" class="form-control form-control-sm" placeholder="User, IP, OS..." value="{{ filters.search }}">
        </div>
        <div class="col-md-2">
            <label class="form-label small text-muted">From Date</label>
            <input type="date" name="from_date" class="form-control form-control-sm" value="{{ filters.from_date }}">
        </div>
        <div class="col-md-2">
            <label class="form-label small text-muted">To Date</label>
            <input type="date" name="to_date" class="form-control form-control-sm" value="{{ filters.to_date }}">
        </div>
        <div class="col-md-2">
            <label class="form-label small text-muted">Device</label>
            <select name="device_type" class="form-select form-select-sm">
                <option value="">All Devices</option>
                <option value="desktop" {% if filters.device_type == 'desktop' %}selected{% endif %}>Desktop</option>
                <option value="mobile" {% if filters.device_type == 'mobile' %}selected{% endif %}>Mobile</option>
                <option value="tablet" {% if filters.device_type == 'tablet' %}selected{% endif %}>Tablet</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small text-muted">Per Page</label>
            <select name="per_page" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="10" {% if filters.per_page == '10' %}selected{% endif %}>10</option>
                <option value="25" {% if filters.per_page == '25' %}selected{% endif %}>25</option>
                <option value="50" {% if filters.per_page == '50' %}selected{% endif %}>50</option>
            </select>
        </div>
        <div class="col-md-1 d-flex gap-2">
            <a href="{% url 'login_activities:list' %}" class="btn btn-primary btn-sm text-white"><i class="bi bi-x-lg"></i></a>
        </div>
    </form>
</div>
