<div class="col-12">
    <div class="table-responsive">
        <table class="table table-hover table-striped align-middle">
            <thead class="table-success">
                <tr>
                    <th>Question</th>
                    <th>Display On</th>
                    <th width="80">Order</th>
                    <th width="100">Status</th>
                    <th width="120">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in page_obj %}
                <tr>
                    <td>
                        <strong>{{ item.question|truncatechars:60 }}</strong>
                        <br><small class="text-muted">{{ item.answer|truncatechars:40 }}</small>
                    </td>
                    <td><span class="badge bg-info text-dark">{{ item.display_on|capfirst }}</span></td>
                    <td>
                        <input type="number" name="order_level" value="{{ item.order_level }}" 
                               data-id="{{ item.id }}" data-original="{{ item.order_level }}" 
                               class="form-control form-control-sm order-level-input" style="width: 60px;">
                    </td>
                    <td>
                        <form class="status-form" data-id="{{ item.id }}">
                            {% csrf_token %}
                            <input type="hidden" name="status_id" value="{{ item.id }}">
                            <input type="checkbox" {% if item.status %}checked{% endif %} 
                                   data-toggle="toggle" data-onstyle="success" data-offstyle="danger" data-size="sm">
                        </form>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="{% url 'faqs:faq_update' item.id %}" class="btn btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form action="{% url 'faqs:faq_delete' item.id %}" method="POST" 
                                  id="deleteForm{{ item.id }}" style="display:inline;">
                                {% csrf_token %}
                                <button type="button" class="btn btn-outline-danger" 
                                        onclick="confirmDelete(event, 'deleteForm{{ item.id }}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="5" class="text-center py-4 text-muted">No FAQs found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
     {% include 'layouts/includes/pagination.html' %}
</div>
