<div class="col-12">
    <form id="filterForm" method="GET" class="row g-3 mb-3">
        <div class="col-md-3">
            <input type="text" name="search" class="form-control form-control-sm"
                   placeholder="🔍 Search name, email..."
                   value="{{ filters.search|default:'' }}">
        </div>

        <div class="col-md-3">
            <select name="display_on" class="form-select form-select-sm">
                <option value="">All Pages</option>
                <option value="default" {% if filters.display_on == 'default' %}selected{% endif %}>Default</option>
                <option value="home" {% if filters.display_on == 'home' %}selected{% endif %}>Home Page</option>
                <option value="product" {% if filters.display_on == 'product' %}selected{% endif %}>Product Page</option>
                <option value="package" {% if filters.display_on == 'package' %}selected{% endif %}>Package Page</option>
                <option value="testimonial" {% if filters.display_on == 'testimonial' %}selected{% endif %}>Testimonial</option>
                <option value="about" {% if filters.display_on == 'about' %}selected{% endif %}>About Page</option>
            </select>
        </div>

        <div class="col-md-2">
            <select name="rating" class="form-select form-select-sm">
                <option value="">All Ratings</option>
                <option value="5" {% if filters.rating == '5' %}selected{% endif %}>⭐ 5 Stars</option>
                <option value="4" {% if filters.rating == '4' %}selected{% endif %}>⭐ 4 Stars</option>
                <option value="3" {% if filters.rating == '3' %}selected{% endif %}>⭐ 3 Stars</option>
                <option value="2" {% if filters.rating == '2' %}selected{% endif %}>⭐ 2 Stars</option>
                <option value="1" {% if filters.rating == '1' %}selected{% endif %}>⭐ 1 Star</option>
            </select>
        </div>

        <div class="col-md-2">
            <select name="status" class="form-select form-select-sm">
                <option value="">All Status</option>
                <option value="1" {% if filters.status == '1' %}selected{% endif %}>✅ Active</option>
                <option value="0" {% if filters.status == '0' %}selected{% endif %}>❌ Inactive</option>
            </select>
        </div>

        <div class="col-md-2 d-flex gap-2">
            <a href="{% url 'reviews:review_list' %}" class="btn btn-primary btn-sm text-white">✕ Reset</a>
        </div>
    </form>
</div>
