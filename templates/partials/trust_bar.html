  {% if site_settings.counter_item %}
  <div class="trust-bar section">
    <div class="container">
      <div class="trust-container">
        {% for item in site_settings.counter_item %}
        <div class="trust-item">
          <div class="icon-box"><i class="{{ item.icon }}"></i></div>
          <div class="text-content">
            <h4>{{ item.title }}</h4>
            <p>{{ item.content }}</p>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
   {% endif %}
