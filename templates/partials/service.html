  <section class="service_section section">
    <div class="container">
      <div class="service-row">
        {% for item in site_settings.process_item %}
        <div class="service_wrap">
          <div class="service_icon"><i class="{{ item.icon }}"></i></div>
          <div class="service_description">
            <h4>{{ item.title }}</h4>
            <p>{{ item.content }}</p>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
