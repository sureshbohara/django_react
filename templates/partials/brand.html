{% if brands %}
<section class="brand_section section">
  <div class="container">
    <div class="offer-banner"><span>Curated Luxury Brands</span></div>
    <div class="brand-grid">
      {% for brand in brands %}
      <a href="{% url 'frontend:shop' %}?brand={{ brand.slug }}" class="brand-card">
        <div class="brand-logo-box">
          {% if brand.logo %}
            <img src="{{ brand.logo.url }}" loading="lazy" alt="{{ brand.name }}">
          {% else %}
            <h5 style="text-align:center; padding: 20px 0;">{{ brand.name }}</h5>
          {% endif %}
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
