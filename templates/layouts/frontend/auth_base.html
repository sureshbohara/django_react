<!-- AUTH MODAL -->
<div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content auth-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="accountModalLabel">Welcome Back</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        

        <form id="loginForm" class="auth-form" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
          <p class="text-center mt-3">New here? <a href="#" id="showRegister">Create an Account</a></p>
          <p id="login-error" class="text-danger text-center mt-2 small" style="display:none;"></p>
        </form>

  
        <form id="registerForm" class="auth-form d-none" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Your Full Name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
          <p class="text-center mt-3">Already have an account? <a href="#" id="showLogin">Login Here</a></p>
          <p id="register-error" class="text-danger text-center mt-2 small" style="display:none;"></p>
        </form>

      </div>
    </div>
  </div>
</div>
