{% load static %}
<header class="top-header">
    <nav class="navbar navbar-expand">
        <div class="mobile-toggle-icon d-xl-none">
            <i class="bi bi-list fs-4"></i>
        </div>
        <div class="top-navbar-right ms-3 ms-auto">
            <ul class="navbar-nav align-items-center">
                <li class="nav-item">
                    <a id="darkModeButton" class="nav-link" href="javascript:void(0);" aria-label="Toggle Dark Mode">
                        <div class="user-setting d-flex align-items-center gap-1">
                            <img id="moonIcon" src="{% static 'default/moon_light.png' %}" class="user-img" alt="Theme">
                            <div class="user-name d-none d-sm-block">Light</div>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/" target="_blank">
                        <div class="user-setting d-flex align-items-center gap-1">
                            <img src="{% static 'default/website.png' %}" class="user-img" alt="Website">
                            <div class="user-name d-none d-sm-block">View Website</div>
                        </div>
                    </a>
                </li>
                <li class="nav-item dropdown dropdown-large">
                    <a class="nav-link dropdown-toggle dropdown-toggle-nocaret" href="#" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-setting d-flex align-items-center gap-1">
                            <img src="{{ request.user.image_url }}" class="user-img" alt="User">
                            <div class="user-name d-none d-sm-block">{{ request.user.name|default:"Admin" }}</div>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="#">
                                <div class="d-flex align-items-center">
                                    <img src="{{ request.user.image_url }}" alt="Profile" class="rounded-circle" width="60" height="60">
                                    <div class="ms-3">
                                        <h6 class="mb-0">{{ request.user.name|default:"Admin" }}</h6>
                                        <small class="text-secondary">Administrator</small>
                                    </div>
                                </div>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person-fill me-2"></i>Update Profile</a></li>
                        <li><a class="dropdown-item" href="{% url 'accounts:change_password' %}"><i class="bi bi-lock me-2"></i>Change Password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form action="{% url 'accounts:logout' %}" method="POST">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-success">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
</header>
