<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background-color: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { background-color: #0d6efd; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0;">{{ site_name }}</h2>
        </div>
        <div class="content">
            <p>Dear {{ customer_name }},</p>
            {{ message|safe }}
        </div>
        <div class="footer">
            <p>Thank you for being our valued customer!</p>
            <p>&copy; {{ site_name }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
